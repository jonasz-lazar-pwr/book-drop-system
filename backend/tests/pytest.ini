[pytest]
minversion = 7.0
asyncio_mode = auto
addopts =
    -ra
    --tb=short
    --disable-warnings
    --cov=api
    --cov=core
    --cov=models
    --cov=schemas
    --cov=services
    --cov-report=term-missing
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning