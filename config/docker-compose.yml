services:
  # === BookDrop Database (PostgreSQL + PostGIS) ===
  bookdrop-database:
    image: postgis/postgis:15-3.4
    container_name: bookdrop-database
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ../config/scripts:/app/config/scripts
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

