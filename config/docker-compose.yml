services:

  # === BookDrop Database (PostgreSQL) ===
  bookdrop-postgres:
    image: postgres:15-alpine
    container_name: bookdrop-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === BookDrop Backend (FastAPI / Uvicorn) ===
  bookdrop-backend:
    image: bookdrop-backend:latest
    container_name: bookdrop-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      bookdrop-postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === BookDrop Frontend (Angular + Nginx) ===
  bookdrop-frontend:
    image: bookdrop-frontend:latest
    container_name: bookdrop-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - bookdrop-backend
    networks:
      - default
    restart: unless-stopped

# === BookDrop Volumes ===
volumes:
  postgres_data:

# === BookDrop Shared Network ===
networks:
  default:
    driver: bridge